name: External observer
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: external-observer
  cancel-in-progress: false
jobs:
  observe:
    if: github.event.repository.private == false && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node run.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONITOR_HOST: ${{ secrets.MONITOR_HOST }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          OBSERVER_STATE_KEY: ${{ secrets.OBSERVER_STATE_KEY }}
          STATE_ISSUE: ${{ vars.STATE_ISSUE }}
